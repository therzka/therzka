name: Metrics
on:
  # Schedule updates every monday at 1:00 UTC
  schedule: [{cron: "0 1 * * 1"}]
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Options
          user: therzka
          base: ""
          config_timezone: America/Los_Angeles
          plugin_stars: yes
          plugin_stars_limit: 8
          extras_css: |
            h1, h2, h3 {
              color: #A56DFF;
            }
            .field svg {
              color: #A56DFF;
            }
            .field {
              color: #A56DFF;
            }
  
